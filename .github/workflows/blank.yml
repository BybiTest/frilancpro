name: Android Build

on:
  push:
    branches:
      - main
      - fix/persist-resume-data
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Bazaar and Myket APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eu
          # GitHub runners enable pipefail by default; avoid failing on yes's expected SIGPIPE.
          set +o pipefail
          if yes | "$SDKMANAGER" --licenses; then
            status=0
          else
            status=$?
          fi
          set -o pipefail
          exit "$status"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD_SECRET" || -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEY_PATH"
          keytool -list -keystore "$KEY_PATH" -storepass "$STORE_PASSWORD_SECRET" -alias upload >/dev/null
          {
            echo "KEYSTORE_PATH=$KEY_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"
      - name: Build all store variants
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          MYKET_RSA_PUBLIC_KEY: ${{ secrets.MYKET_RSA_PUBLIC_KEY }}
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testBazaarDebugUnitTest :app:testMyketDebugUnitTest :app:assembleBazaarDebug :app:assembleBazaarRelease :app:bundleBazaarRelease :app:assembleMyketDebug :app:assembleMyketRelease :app:bundleMyketRelease
      - name: Generate Cafe Bazaar BIN
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE_SIGNER_VERSION="0.1.14"
          BUNDLE_SIGNER_JAR="$RUNNER_TEMP/bundlesigner-${BUNDLE_SIGNER_VERSION}.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/cafebazaar/bundle-signer/releases/download/v${BUNDLE_SIGNER_VERSION}/bundlesigner-${BUNDLE_SIGNER_VERSION}.jar" \
            --output "$BUNDLE_SIGNER_JAR"
          test -s "$BUNDLE_SIGNER_JAR"
          mkdir -p app/build/outputs/bin/bazaar
          java -Xmx4g -jar "$BUNDLE_SIGNER_JAR" genbin -v \
            --bundle app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab \
            --bin app/build/outputs/bin/bazaar/ \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias upload \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD
          test -s app/build/outputs/bin/bazaar/app-bazaar-release.bin
      - name: Verify APK and AAB outputs
        shell: bash
        run: |
          set -euo pipefail
          for path in app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk app/build/outputs/apk/bazaar/release/app-bazaar-release.apk app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab app/build/outputs/bin/bazaar/app-bazaar-release.bin app/build/outputs/apk/myket/debug/app-myket-debug.apk app/build/outputs/apk/myket/release/app-myket-release.apk app/build/outputs/bundle/myketRelease/app-myket-release.aab; do
            test -s "$path" || { echo "::error::Missing build output: $path"; exit 1; }
          done
          ls -lh app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk app/build/outputs/apk/bazaar/release/app-bazaar-release.apk app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab app/build/outputs/apk/myket/debug/app-myket-debug.apk app/build/outputs/apk/myket/release/app-myket-release.apk app/build/outputs/bundle/myketRelease/app-myket-release.aab
      - name: Upload Bazaar debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-bazaar-debug-apk
          path: app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Bazaar release APK
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-bazaar-release-apk
          path: app/build/outputs/apk/bazaar/release/app-bazaar-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Bazaar release AAB
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-bazaar-release-aab
          path: app/build/outputs/bundle/bazaarRelease/app-bazaar-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Bazaar release BIN
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-bazaar-release-bin
          path: app/build/outputs/bin/bazaar/app-bazaar-release.bin
          if-no-files-found: error
          retention-days: 14
      - name: Upload Myket debug APK
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-myket-debug-apk
          path: app/build/outputs/apk/myket/debug/app-myket-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Myket release APK
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-myket-release-apk
          path: app/build/outputs/apk/myket/release/app-myket-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Myket release AAB
        uses: actions/upload-artifact@v4
        with:
          name: freelancepro-myket-release-aab
          path: app/build/outputs/bundle/myketRelease/app-myket-release.aab
          if-no-files-found: error
          retention-days: 14
