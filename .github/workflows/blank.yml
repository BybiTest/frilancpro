
name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK, AAB and Bazaar BIN
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || \
                -z "$STORE_PASSWORD_SECRET" || \
                -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "::error::Release signing secrets are missing."
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/upload-key.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEY_PATH"

          keytool -list \
            -keystore "$KEY_PATH" \
            -storepass "$STORE_PASSWORD_SECRET" \
            -alias upload >/dev/null

          {
            echo "KEYSTORE_PATH=$KEY_PATH"
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

          echo "Release keystore validated."

      - name: Build APK and AAB
        env:
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$AAB"

          echo "APK and AAB files:"
          ls -lh "$DEBUG_APK" "$RELEASE_APK" "$AAB"

      - name: Generate Cafe Bazaar BIN
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"
          BIN_DIR="app/build/outputs/bundle/release/bin"
          SIGNER="$RUNNER_TEMP/bundlesigner-0.1.13.jar"

          test -s "$AAB"
          mkdir -p "$BIN_DIR"

          curl --fail --location --silent --show-error \
            "https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundlesigner-0.1.13.jar" \
            --output "$SIGNER"

          java -jar "$SIGNER" genbin \
            --bundle "$AAB" \
            --bin "$BIN_DIR" \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias upload \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD

          echo "Generated BIN files:"
          find "$BIN_DIR" -maxdepth 1 -type f -name '*.bin' -ls

          if ! find "$BIN_DIR" -maxdepth 1 -type f \
            -name '*.bin' -print -quit | grep -q .; then
            echo "::error::BundleSigner did not generate a BIN file."
            exit 1
          fi

      - name: Verify all build outputs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          BIN_DIR="app/build/outputs/bundle/release/bin"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          test -s "$AAB"

          BIN_COUNT="$(find "$BIN_DIR" -maxdepth 1 \
            -type f -name '*.bin' -size +0c | wc -l)"

          if [ "$BIN_COUNT" -lt 1 ]; then
            echo "::error::No valid BIN file was generated."
            exit 1
          fi

          echo "Final output files:"
          ls -lh "$DEBUG_APK" "$RELEASE_APK" "$AAB"
          find "$BIN_DIR" -maxdepth 1 \
            -type f -name '*.bin' -exec ls -lh {} \;

      - name: Upload APK, AAB and BIN
        uses: actions/upload-artifact@v4
        with:
          name: frilancpro-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/bin/*.bin
          if-no-files-found: error
          retention-days: 14
