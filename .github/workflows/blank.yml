
name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not configured."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Required Gradle project files found."

      - name: Create missing debug keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f debug.keystore
          echo "Debug keystore is ready."

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEY_PATH="$RUNNER_TEMP/upload-key.jks"

          if [[ -n "$KEYSTORE_BASE64" && \
                -n "$STORE_PASSWORD_SECRET" && \
                -n "$KEY_PASSWORD_SECRET" ]]; then

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode > "$KEY_PATH"

            {
              echo "KEYSTORE_PATH=$KEY_PATH"
              echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET"
              echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"

            echo "Configured the supplied release key."

          else
            TEMP_PASSWORD="$(openssl rand -hex 24)"

            keytool -genkeypair \
              -keystore "$KEY_PATH" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Temporary CI Build, OU=Build, O=frilancpro, C=US"

            {
              echo "KEYSTORE_PATH=$KEY_PATH"
              echo "STORE_PASSWORD=$TEMP_PASSWORD"
              echo "KEY_PASSWORD=$TEMP_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "::warning::A temporary release key is being used. Do not publish this AAB as an update to an existing app."
          fi

      - name: Build debug APK and release AAB
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            :app:assembleDebug \
            :app:bundleRelease

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "Debug APK was not generated."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "Release AAB was not generated."
            exit 1
          fi

          ls -lh "$APK" "$AAB"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: frilancpro-android-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
